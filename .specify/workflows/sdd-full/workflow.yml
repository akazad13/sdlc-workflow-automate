schema_version: "1.0"
workflow:
  id: "sdd-full"
  name: "Full Spec-Driven AI Workflow (PRD to PR)"
  version: "2.0.0"
  author: "Autonomous SDLC Platform"
  description: >-
    PRD intake with codebase discovery and a traceable requirements register, then per module:
    spec (REQ -> AC -> task IDs) -> incremental implementation with an independent, evidence-based
    review -> measured verification -> right-sized PR. Run intake once; repeat the module steps for
    each module (`python scripts/sdd_engine.py status` lists the ones that are unblocked, and
    independent modules can run in parallel).

requires:
  speckit_version: ">=0.8.5"
  integrations:
    any:
      - "agy"
      - "copilot"
      - "claude"

inputs:
  prd:
    type: string
    required: true
    prompt: "Path to your PRD document or paste PRD content"
  module:
    type: string
    required: true
    prompt: "Module slug from module-decomposition.md to specify, implement, and ship"
  max_iterations:
    type: integer
    default: 3
    prompt: "Max review iterations before the module is marked BLOCKED (also set max_review_iterations in .specify/config.json)"

steps:
  - id: prd-intake-and-interview
    command: sdd-intake
    input:
      args: "{{ inputs.prd }}"

  - id: gate-architecture-approval
    type: gate
    message: >-
      Review requirements.md (every PRD statement captured, clarifications answered),
      system-architecture.md, and module-decomposition.md. `sdd_engine.py validate --all` must
      report 0 errors.
    options: [approve, reject]
    on_reject: abort

  - id: module-specification
    command: sdd-spec
    input:
      args: "{{ inputs.module }}"

  - id: gate-spec-approval
    type: gate
    message: >-
      Review spec.md, plan.md (delivery slices), and tasks.md. `sdd_engine.py validate --module`
      must report 0 errors and no [NEEDS CLARIFICATION] markers may remain.
    options: [approve, reject]
    on_reject: abort

  - id: implementation-and-review-loop
    command: sdd-loop
    input:
      args: "{{ inputs.module }}"

  - id: gate-review-approval
    type: gate
    message: >-
      Check review-log.md ends with STATUS: APPROVED (not BLOCKED) and verification.md shows
      RESULT: PASS. Read the AC coverage matrix and any accepted Minor findings.
    options: [approve, reject]
    on_reject: abort

  - id: pull-request
    command: sdd-pr
    input:
      args: "{{ inputs.module }}"
