# Continuous Integration (CI) quality gate template.
# Uncomment the block for your stack. Mark the "build-and-test" and "sdd-gates" jobs as required
# status checks in branch protection so nothing merges on red.
name: Continuous Integration (CI)

on:
  push:
    branches: [ "main" ]
  # All target branches, so stacked PRs (feature/b -> feature/a) are gated too.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Deterministic checks on the SDD artifacts: no unresolved markers, every acceptance criterion
  # planned and referenced by a test, acyclic module and task dependencies.
  sdd-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Validate roadmap and module specs
      run: |
        if [ -d .specify/specs ]; then
          python scripts/sdd_engine.py validate --all --stage spec
        else
          echo "No module specs yet."
        fi
    - name: Validate implementation traceability for modules changed in this PR
      if: github.event_name == 'pull_request'
      run: |
        base="origin/${{ github.base_ref }}"
        for slug in $(git diff --name-only "$base"...HEAD | sed -n 's#^\.specify/specs/\([^/]*\)/.*#\1#p' | sort -u); do
          if [ -f ".specify/specs/$slug/spec.md" ]; then
            python scripts/sdd_engine.py validate --module "$slug" --stage impl
          fi
        done

  # Regression suite for the toolkit itself (scripts/sdd_engine.py, .github/scripts/pr_review_agent.py).
  # Stdlib unittest only; delete this job if you removed tests/toolkit from your project.
  toolkit-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Run toolkit tests
      run: python -m unittest discover -s tests/toolkit -v

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # =========================================================================
    # OPTION A: Node.js / TypeScript
    # =========================================================================
