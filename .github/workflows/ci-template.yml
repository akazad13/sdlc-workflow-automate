    # - uses: actions/setup-dotnet@v4
    #   with:
    #     dotnet-version: '10.0.x'
    # - run: dotnet restore
    # - run: dotnet build --no-restore --configuration Release --warnaserror
    # - run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage"

    # =========================================================================
    # Monorepos: run only affected projects with a paths filter (e.g. dorny/paths-filter)
    # or your build tool's affected-graph command (nx affected, turbo --filter, bazel query).
    # =========================================================================

    # Replace this step once a stack block above is enabled. A green check here means nothing was tested.
    - name: Not configured
      run: echo "::warning::CI template not configured. Uncomment the block for your stack and delete this step."
