name: Autonomous SDLC Agent Pipeline

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

# Queue jobs per issue without canceling in-progress runs
concurrency:
  group: sdlc-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  autonomous-sdlc:
    # Trigger ONLY when the 'sdlc-agent' label specifically is added
    if: github.event.label.name == 'sdlc-agent'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Run Antigravity Autonomous SDLC Skill Runner
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        ISSUE_NUMBER: ${{ github.event.issue.number }}
        ISSUE_TITLE: ${{ github.event.issue.title }}
        ISSUE_BODY: ${{ github.event.issue.body }}
        GITHUB_EVENT_PATH: ${{ env.GITHUB_EVENT_PATH }}
      run: |
        python .agents/runner/sdlc_agent_runner.py --issue ${{ github.event.issue.number }}

    - name: Commit & Push Code and Artifacts to Branch
      id: git_push
      run: |
        ISSUE_NUM="${{ github.event.issue.number }}"
        BRANCH_NAME="feat/issue-${ISSUE_NUM}-autonomous-impl"
        echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT

        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        git checkout -B ${BRANCH_NAME}
        git add -A

        if git diff-index --quiet HEAD --; then
          echo "No changes to commit."
        else
          git commit -m "feat(issue-${ISSUE_NUM}): autonomous skill-driven implementation and verification"
          git push -f origin ${BRANCH_NAME}
        fi

    - name: Create Pull Request & Post Review Summary
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          const issueNumber = context.issue.number;
          const branchName = `feat/issue-${issueNumber}-autonomous-impl`;
          
          const specFile = `artifacts/spec_issue_${issueNumber}.md`;
          const planFile = `artifacts/plan_issue_${issueNumber}.md`;
          const reviewFile = `artifacts/pr_review_issue_${issueNumber}.md`;
          
          let specContent = fs.existsSync(specFile) ? fs.readFileSync(specFile, 'utf8') : '';
          let reviewContent = fs.existsSync(reviewFile) ? fs.readFileSync(reviewFile, 'utf8') : '';
          
          const prBody = `## 🤖 Autonomous SDLC Skill-Driven Pull Request\n\nCloses #${issueNumber}\n\n` +
            `### 📋 Formalized Specification\n${specContent}\n\n` +
            `### 🛡️ Quality Gate & Test Review\n${reviewContent}`;

          // Create or update Pull Request
          try {
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `feat(issue-${issueNumber}): ${context.payload.issue.title}`,
              head: branchName,
              base: 'main',
              body: prBody
            });
            
            // Post comment on the issue linking to the PR
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `### 🚀 Autonomous SDLC Skill Runner Completed!\n\n` +
                    `✅ **All xUnit tests passed**\n` +
                    `✅ **Roslyn Quality & Security Gate passed (100%)**\n\n` +
                    `👉 **Pull Request Created:** #${pr.data.number} (${pr.data.html_url})`
            });
          } catch (e) {
            console.log("PR may already exist or no diff against main:", e.message);
            // Post comment on the issue
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `### 🤖 Autonomous SDLC Pipeline Executed for Issue #${issueNumber}\n\n` +
                    `#### 🛡️ Quality Gate & Review\n${reviewContent}`
            });
          }
