name: Autonomous SDLC Agent Pipeline

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  autonomous-sdlc:
    if: contains(github.event.issue.labels.*.name, 'sdlc-agent') || github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Run SDLC Autonomous Orchestrator Engine
      env:
        ISSUE_NUMBER: ${{ github.event.issue.number }}
        ISSUE_TITLE: ${{ github.event.issue.title }}
        ISSUE_BODY: ${{ github.event.issue.body }}
        GITHUB_EVENT_PATH: ${{ env.GITHUB_EVENT_PATH }}
      run: |
        dotnet run --project src/NanoLink.Orchestrator -- --issue ${{ github.event.issue.number }}

    - name: Commit & Push Code and Artifacts to Branch
      id: git_push
      run: |
        ISSUE_NUM="${{ github.event.issue.number }}"
        BRANCH_NAME="feat/issue-${ISSUE_NUM}-autonomous-impl"
        echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT

        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        git checkout -B ${BRANCH_NAME}
        git add src/ tests/ artifacts/ CHANGELOG.md .agents/ .github/ *.csproj *.sln* appsettings*.json .gitignore

        if git diff-index --quiet HEAD --; then
          echo "No changes to commit."
        else
          git commit -m "feat(issue-${ISSUE_NUM}): autonomous C# implementation and test verification"
          git push -f origin ${BRANCH_NAME}
        fi

    - name: Create Pull Request & Post Review Summary
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          const issueNumber = context.issue.number;
          const branchName = `feat/issue-${issueNumber}-autonomous-impl`;
          
          const specFile = `artifacts/spec_issue_${issueNumber}.md`;
          const planFile = `artifacts/plan_issue_${issueNumber}.md`;
          const reviewFile = `artifacts/pr_review_issue_${issueNumber}.md`;
          
          let specContent = fs.existsSync(specFile) ? fs.readFileSync(specFile, 'utf8') : '';
          let reviewContent = fs.existsSync(reviewFile) ? fs.readFileSync(reviewFile, 'utf8') : '';
          
          const prBody = `## 🤖 Autonomous SDLC Pipeline Pull Request\n\nCloses #${issueNumber}\n\n` +
            `### 📋 Formalized Specification\n${specContent}\n\n` +
            `### 🛡️ Quality Gate & Test Review\n${reviewContent}`;

          // Create or update Pull Request
          try {
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `feat(issue-${issueNumber}): ${context.payload.issue.title}`,
              head: branchName,
              base: 'main',
              body: prBody
            });
            
            // Post comment on the issue linking to the PR
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `### 🚀 Autonomous SDLC Pipeline Completed!\n\n` +
                    `✅ **All xUnit tests passed**\n` +
                    `✅ **Roslyn Quality & Security Gate passed (100%)**\n\n` +
                    `👉 **Pull Request Created:** #${pr.data.number} (${pr.data.html_url})`
            });
          } catch (e) {
            console.log("PR may already exist or no diff against main:", e.message);
            // Post comment on the issue
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `### 🤖 Autonomous SDLC Pipeline Executed for Issue #${issueNumber}\n\n` +
                    `#### 🛡️ Quality Gate & Review\n${reviewContent}`
            });
          }
