name: Autonomous SDLC Agent Pipeline

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  autonomous-sdlc:
    if: contains(github.event.issue.labels.*.name, 'sdlc-agent') || github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Run SDLC Autonomous Orchestrator Engine
      env:
        ISSUE_NUMBER: ${{ github.event.issue.number }}
        ISSUE_TITLE: ${{ github.event.issue.title }}
        ISSUE_BODY: ${{ github.event.issue.body }}
        GITHUB_EVENT_PATH: ${{ env.GITHUB_EVENT_PATH }}
      run: |
        dotnet run --project src/NanoLink.Orchestrator -- --issue ${{ github.event.issue.number }}

    - name: Post Triage & Review Summary Comment to GitHub Issue
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          const issueNumber = context.issue.number;
          let body = `### 🤖 Autonomous SDLC Pipeline Executed Successfully for Issue #${issueNumber}\n\n`;
          
          const specFile = `artifacts/spec_issue_${issueNumber}.md`;
          const planFile = `artifacts/plan_issue_${issueNumber}.md`;
          const reviewFile = `artifacts/pr_review_issue_${issueNumber}.md`;
          
          if (fs.existsSync(specFile)) {
            body += `#### 📋 Formalized Specification\n` + fs.readFileSync(specFile, 'utf8') + `\n\n`;
          }
          if (fs.existsSync(reviewFile)) {
            body += `#### 🛡️ Quality Gate & Review\n` + fs.readFileSync(reviewFile, 'utf8') + `\n\n`;
          }
          
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: issueNumber,
            body: body
          });

    - name: Commit & Push Generated Artifacts
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add artifacts/ CHANGELOG.md
        git diff-index --quiet HEAD || (git commit -m "chore(sdlc): update artifacts for issue #${{ github.event.issue.number }}" && git push origin HEAD:main)
